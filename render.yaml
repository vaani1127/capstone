services:
  - type: web
    name: healthsaathi-backend
    env: python
    plan: free

    # Build configuration
    buildCommand: |
      cd project/backend
      pip install -r requirements.txt
      alembic upgrade head

    # Start command
    startCommand: |
      cd project/backend
      uvicorn app.main:app --host 0.0.0.0 --port 10000

    # Environment variables (replace with your Neon database URL)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthsaathi-neon
          property: connectionString
      - key: JWT_SECRET
        value: your-secret-key-min-32-chars-here-change-this
      - key: JWT_ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: AUTO_TUNE_CONTAMINATION
        value: "false"
      - key: ANOMALY_ALERT_THRESHOLD
        value: "0.5"
      - key: LOG_LEVEL
        value: INFO
