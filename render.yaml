services:
  - type: web
    name: healthsaathi-backend
    env: python
    plan: free
    pythonVersion: 3.11

    # Build configuration
    buildCommand: pip install -r project/backend/requirements.txt && cd project/backend && alembic upgrade head

    # Start command
    startCommand: cd project/backend && uvicorn app.main:app --host 0.0.0.0 --port 10000

    # Environment variables (replace with your Neon database URL)
    envVars:
      - key: DATABASE_URL
        value: postgresql://your-neon-connection-string-here
      - key: JWT_SECRET
        value: your-secret-key-min-32-chars-here-change-this-123456789
      - key: JWT_ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
      - key: AUTO_TUNE_CONTAMINATION
        value: "false"
      - key: ANOMALY_ALERT_THRESHOLD
        value: "0.5"
      - key: LOG_LEVEL
        value: INFO
